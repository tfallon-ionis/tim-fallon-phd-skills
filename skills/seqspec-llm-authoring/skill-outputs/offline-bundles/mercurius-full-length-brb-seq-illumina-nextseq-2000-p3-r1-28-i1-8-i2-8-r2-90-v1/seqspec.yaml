description: Mercurius Full-Length BRB-seq acquired on an Illumina NextSeq 2000 with
  a P3 XLEAP-SBS 100-cycle reagent kit as R1 28, I1 8, I2 8, and R2 90 cycles. The
  standard TruSeq Read 1 and Read 2 sequencing-primer sites are represented explicitly.
