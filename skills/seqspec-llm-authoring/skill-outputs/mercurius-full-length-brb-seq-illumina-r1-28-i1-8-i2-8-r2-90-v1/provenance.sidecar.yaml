barcode_semantics:
  vocabulary_version: 1.1.0
  regions:
  - region_id: sample_barcode
    semantic_type: demultiplexing_barcode
    observed_in: R1
    groups_reads_by: library_preparation_input
  - region_id: umi
    semantic_type: molecular_identifier
    observed_in: R1
    groups_reads_by: source_molecule
    external_mappings:
    - vocabulary: SAM
      term: RX/OX/MI
  - region_id: i7
    semantic_type: demultiplexing_barcode
    observed_in: I1
    index_role: i7
    alternate_name: Index 1
    groups_reads_by: flowcell_lane_pool_member
  - region_id: i5
    semantic_type: demultiplexing_barcode
    observed_in: I2
    index_role: i5
    alternate_name: Index 2
    groups_reads_by: flowcell_lane_pool_member
  index_schemes:
  - scheme_id: mf_udi
    type: unique_dual_index
    members:
    - i7
    - i5
    pair_sequence_basis: seqspec_region
    allowed_pairs:
    - pair_id: MF.UDI.1
      i7: GCTTGTCA
      i5: AGGCGAAG
    - pair_id: MF.UDI.2
      i7: CAAGCTAG
      i5: TAATCTTA
    - pair_id: MF.UDI.3
      i7: AGTTCAGG
      i5: CAGGACGT
    - pair_id: MF.UDI.4
      i7: GACCTGAA
      i5: GTACTGAC
